name: Assemble and verify Android APK
description: Shared compilation, signing and verification for Android release APKs

inputs:
  signing-mode:
    description: release for distribution, unsigned for checks without signing secrets
    default: release
  cache-read-only:
    description: Whether the Gradle cache is read-only
    default: 'true'
  keystore-base64:
    description: Base64-encoded distribution keystore
    default: ''
  key-alias:
    description: Distribution key alias
    default: ''
  key-password:
    description: Distribution key password
    default: ''
  store-password:
    description: Distribution keystore password
    default: ''

runs:
  using: composite
  steps:
    - name: Validate signing mode
      shell: bash
      env:
        SIGNING_MODE: ${{ inputs.signing-mode }}
      run: |
        case "$SIGNING_MODE" in
          release|unsigned) ;;
          *) echo 'Unsupported signing mode'; exit 1 ;;
        esac

    - name: Check CI helper scripts
      shell: bash
      run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

    - name: Keep Gradle caches outside the workspace
      shell: bash
      run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"

    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle and cache
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Set up Android SDK and install packages
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: 'platform-tools platforms;android-37.0 build-tools;36.1.0'
        log-accepted-android-sdk-licenses: false

    - name: Decode signing key
      if: inputs.signing-mode == 'release'
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        STORE_PASSWORD: ${{ inputs.store-password }}
      run: |
        for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
          test -n "${!name}" || { echo "Missing $name"; exit 1; }
        done
        umask 077
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

    - name: Assemble release APK
      shell: bash
      env:
        SIGNING_MODE: ${{ inputs.signing-mode }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        STORE_PASSWORD: ${{ inputs.store-password }}
      run: |
        if [[ "$SIGNING_MODE" == 'release' ]]; then
          export KEY_STORE_PATH="$RUNNER_TEMP/release.jks"
        fi
        chmod +x gradlew
        ./gradlew :app:assembleRelease --build-cache --stacktrace --no-daemon --project-cache-dir "$RUNNER_TEMP/gradle-project-cache"

    - name: Verify distribution signature
      if: inputs.signing-mode == 'release'
      shell: bash
      run: bash .github/scripts/verify_apk.sh app/build/outputs/apk/release/app-release.apk

    - name: Remove signing key
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/release.jks"
