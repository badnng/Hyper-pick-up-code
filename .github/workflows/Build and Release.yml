name: Build and Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      index_artifact: update-index-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to overwrite an already published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_metadata.py check-release

      - name: Keep Gradle caches outside the workspace
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.1.0'

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK and run unit tests
        env:
          KEY_STORE_PATH: ${{ runner.temp }}/release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:testReleaseUnitTest --build-cache --stacktrace --no-daemon --project-cache-dir "$RUNNER_TEMP/gradle-project-cache"

      - name: Verify APK signature
        run: bash .github/scripts/verify_apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/wear/package-lock.json

      - name: Decode RPK signing keys
        env:
          RPK_CERT_BASE64: ${{ secrets.RPK_CERT_BASE64 }}
          RPK_PRIVATE_KEY_BASE64: ${{ secrets.RPK_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$RPK_CERT_BASE64" && test -n "$RPK_PRIVATE_KEY_BASE64" || { echo 'Missing RPK signing secrets'; exit 1; }
          umask 077
          mkdir -p app/wear/sign/release
          printf '%s' "$RPK_CERT_BASE64" | base64 --decode > app/wear/sign/release/certificate.pem
          printf '%s' "$RPK_PRIVATE_KEY_BASE64" | base64 --decode > app/wear/sign/release/private.pem

      - name: Build watch RPK
        working-directory: app/wear
        run: |
          npm ci
          npm run release
          python3 - <<'PY'
          import json
          from pathlib import Path
          import zipfile

          packages = list(Path('dist').glob('*.rpk'))
          if len(packages) != 1:
              raise SystemExit('Expected exactly one RPK')
          package = packages[0]
          with zipfile.ZipFile(package) as archive:
              version = json.loads(archive.read('manifest.json'))['versionName']
          source_version = json.loads(Path('src/manifest.json').read_text())['versionName']
          if not version or version != source_version:
              raise SystemExit('RPK version differs from source manifest')
          package.rename(package.with_name(f'com.Badnng.moe_Release_{version}.rpk'))
          PY

      - name: Generate update indexes from the built APK metadata
        id: metadata
        run: python3 .github/scripts/build_metadata.py release --output "$RUNNER_TEMP/update-index"

      - name: Save update indexes for the publication job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/update-index/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            app/build/outputs/apk/release/app-release.apk
            app/wear/dist/com.Badnng.moe_Release_*.rpk

      - name: Upload release artifacts for recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/release/
            app/build/outputs/mapping/release/
            app/wear/dist/*.rpk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # 先创建草稿并完成附件上传，附件全部成功后才对外发布。
      - name: Stage release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/update-index/release-notes.md
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/wear/dist/com.Badnng.moe_Release_*.rpk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

      - name: Remove signing keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          rm -f app/wear/sign/release/certificate.pem app/wear/sign/release/private.pem

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == 'true' ]]; then
            gh release edit "$TAG_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG_NAME" --draft=false --prerelease=false
          fi

  update_index:
    name: Publish app update indexes
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release.outputs.index_artifact }}
          path: ${{ runner.temp }}/update-index

      # 保留客户端使用的 master/Stable.json、Dev.json；仅成功发布后更新。
      - name: Publish update indexes to master
        run: python3 .github/scripts/build_metadata.py publish --output "$RUNNER_TEMP/update-index"
