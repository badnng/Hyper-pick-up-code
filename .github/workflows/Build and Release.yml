name: Build and Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      index_artifact: update-index-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Refuse to overwrite an already published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_metadata.py check-release

      - name: Build Android release
        uses: ./.github/actions/build-android-release
        with:
          signing-mode: release
          cache-read-only: 'true'
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          store-password: ${{ secrets.STORE_PASSWORD }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/wear/package-lock.json

      - name: Decode RPK signing keys
        env:
          RPK_CERT_BASE64: ${{ secrets.RPK_CERT_BASE64 }}
          RPK_PRIVATE_KEY_BASE64: ${{ secrets.RPK_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$RPK_CERT_BASE64" && test -n "$RPK_PRIVATE_KEY_BASE64" || { echo 'Missing RPK signing secrets'; exit 1; }
          umask 077
          mkdir -p app/wear/sign/release
          printf '%s' "$RPK_CERT_BASE64" | base64 --decode > app/wear/sign/release/certificate.pem
          printf '%s' "$RPK_PRIVATE_KEY_BASE64" | base64 --decode > app/wear/sign/release/private.pem

      - name: Build watch RPK
        working-directory: app/wear
        run: |
          npm ci
          npm run release
          python3 - <<'PY'
          import json
          from pathlib import Path
          import zipfile

          packages = list(Path('dist').glob('*.rpk'))
          if len(packages) != 1:
              raise SystemExit('Expected exactly one RPK')
          package = packages[0]
          with zipfile.ZipFile(package) as archive:
              version = json.loads(archive.read('manifest.json'))['versionName']
          source_version = json.loads(Path('src/manifest.json').read_text())['versionName']
          if not version or version != source_version:
              raise SystemExit('RPK version differs from source manifest')
          package.rename(package.with_name(f'com.Badnng.moe_Release_{version}.rpk'))
          PY

      - name: Generate update indexes from the built APK metadata
        id: metadata
        run: python3 .github/scripts/build_metadata.py release --output "$RUNNER_TEMP/update-index"

      - name: Save update indexes for the publication job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/update-index/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            app/build/outputs/apk/release/app-release.apk
            app/wear/dist/com.Badnng.moe_Release_*.rpk

      - name: Upload release artifacts for recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/release/
            app/build/outputs/mapping/release/
            app/wear/dist/*.rpk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # 先创建草稿并完成附件上传，附件全部成功后才对外发布。
      - name: Stage release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/update-index/release-notes.md
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/wear/dist/com.Badnng.moe_Release_*.rpk

      - name: Remove RPK signing keys
        if: always()
        run: rm -f app/wear/sign/release/certificate.pem app/wear/sign/release/private.pem

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == 'true' ]]; then
            gh release edit "$TAG_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG_NAME" --draft=false --prerelease=false
          fi

  update_index:
    name: Publish app update indexes
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.release.outputs.index_artifact }}
          path: ${{ runner.temp }}/update-index

      # 保留客户端使用的 master/Stable.json、Dev.json；仅成功发布后更新。
      - name: Publish update indexes to master
        run: python3 .github/scripts/build_metadata.py publish --output "$RUNNER_TEMP/update-index"
