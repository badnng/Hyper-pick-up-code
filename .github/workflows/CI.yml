name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 每次 push 都保留构建；只取消同一 PR 的旧构建。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISTRIBUTION_BUILD: ${{ github.repository == 'badnng/Hyper-pick-up-code' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') }}
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Android release
        uses: ./.github/actions/build-android-release
        with:
          signing-mode: ${{ env.DISTRIBUTION_BUILD == 'true' && 'release' || 'unsigned' }}
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev') }}
          keystore-base64: ${{ env.DISTRIBUTION_BUILD == 'true' && secrets.KEYSTORE_BASE64 || '' }}
          key-alias: ${{ env.DISTRIBUTION_BUILD == 'true' && secrets.KEY_ALIAS || '' }}
          key-password: ${{ env.DISTRIBUTION_BUILD == 'true' && secrets.KEY_PASSWORD || '' }}
          store-password: ${{ env.DISTRIBUTION_BUILD == 'true' && secrets.STORE_PASSWORD || '' }}

      - name: Package CI artifacts
        id: package
        run: python3 .github/scripts/build_metadata.py ci --variant release --output "$RUNNER_TEMP/ci-dist"

      - name: Upload APK, checksum and build information
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/ci-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Save R8 mapping for CI crash analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-mapping-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 14

  telegram:
    name: Send CI APK to Telegram
    needs: build
    # 在仓库 Variables 中显式启用；PR、fork 和其它分支不会向频道发消息。
    if: >-
      vars.TELEGRAM_ENABLED == 'true' &&
      github.repository == 'badnng/Hyper-pick-up-code' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/ci-dist

      - name: Upload APK with commit description
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
        run: python3 .github/scripts/telegram_ci.py "$RUNNER_TEMP/ci-dist"
