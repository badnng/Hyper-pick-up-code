name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 每次 push 都保留构建；只取消同一 PR 的旧构建。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Keep Gradle caches outside the workspace
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"

      - name: Check CI helper scripts
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev') }}

      - name: Set up Android SDK and install packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.1.0'
          log-accepted-android-sdk-licenses: false

      - name: Select build variant
        id: variant
        env:
          SIGNED_BUILD: ${{ github.repository == 'badnng/Hyper-pick-up-code' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') }}
        run: |
          if [[ "$SIGNED_BUILD" == 'true' ]]; then
            echo 'name=release' >> "$GITHUB_OUTPUT"
            echo 'tasks=:app:assembleRelease :app:testReleaseUnitTest' >> "$GITHUB_OUTPUT"
          else
            echo 'name=debug' >> "$GITHUB_OUTPUT"
            echo 'tasks=:app:assembleDebug :app:testDebugUnitTest' >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing key
        if: steps.variant.outputs.name == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEY_STORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK and run unit tests
        env:
          GRADLE_TASKS: ${{ steps.variant.outputs.tasks }}
          KEY_ALIAS: ${{ steps.variant.outputs.name == 'release' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ steps.variant.outputs.name == 'release' && secrets.KEY_PASSWORD || '' }}
          STORE_PASSWORD: ${{ steps.variant.outputs.name == 'release' && secrets.STORE_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          # GRADLE_TASKS 仅来自上一步的固定任务名。
          read -r -a tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}" --build-cache --stacktrace --no-daemon --project-cache-dir "$RUNNER_TEMP/gradle-project-cache"

      - name: Verify distribution signature
        if: steps.variant.outputs.name == 'release'
        run: bash .github/scripts/verify_apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Package CI artifacts
        id: package
        env:
          BUILD_VARIANT: ${{ steps.variant.outputs.name }}
        run: python3 .github/scripts/build_metadata.py ci --variant "$BUILD_VARIANT" --output "$RUNNER_TEMP/ci-dist"

      - name: Upload APK, checksum and build information
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/ci-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  telegram:
    name: Send CI APK to Telegram
    needs: build
    # 在仓库 Variables 中显式启用；PR、fork 和其它分支不会向频道发消息。
    if: >-
      vars.TELEGRAM_ENABLED == 'true' &&
      github.repository == 'badnng/Hyper-pick-up-code' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/ci-dist

      - name: Upload APK with commit description
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
        run: python3 .github/scripts/telegram_ci.py "$RUNNER_TEMP/ci-dist"
